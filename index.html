<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nostr Event Viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Nostr Event Viewer</h1>
        <p>Search and display Nostr events by tag or URI</p>
      </div>

      <div class="controls">
        <div class="input-group">
          <label for="tagInput">Tag/URI:</label>
          <input
            type="text"
            id="tagInput"
            class="tag-input"
            placeholder="Enter tag value or URI (e.g., txo:tbtc4:f0bf1cf69bfd3a7667bf4446683feba06dd6feda098f475e21682cc95f48124a:0)"
            value="txo:tbtc4:f0bf1cf69bfd3a7667bf4446683feba06dd6feda098f475e21682cc95f48124a:0"
          />
          <button id="fetchBtn" class="btn">Fetch Events</button>
        </div>
      </div>

      <div id="status" class="status" style="display: none"></div>

      <div class="events-container">
        <div id="eventsDisplay"></div>
      </div>
    </div>

    <script src="utils.js"></script>
    <script src="main.js"></script>
  </body>
</html>
